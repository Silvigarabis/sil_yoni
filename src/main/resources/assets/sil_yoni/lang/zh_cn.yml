death.attack.dense_energy.player: '%1$s在与%2$s战斗时被注入了太多的能量'
death.attack.dense_energy_explosion: '%1$s被能量爆炸抹除了'
death.attack.dense_energy_explosion.player: '%1$s被%2$s的能量爆炸抹除了'

sil_yoni.gui.badge.hold_on_active: 按住 %s 不放（10秒）以使用
sil_yoni.gui.badge.long_press_active: 长按 %s （4秒）以使用
sil_yoni.gui.badge.long_press_toggle: 长按 %s （4秒）以切换
sil_yoni.gui.badge.only_usable_in_void_space: 只在虚空空间当中可用
sil_yoni.gui.badge.triple_click_active: 连按三次 %s 以使用

container.sil_yoni:void_inventory: 虚空存储

origin.sil_yoni.guxi0.name: 咕西
origin.sil_yoni.guxi0.description: >-
  兮芾的种族。看起来他们比较娇小，这是因为他们以能量组成了身体。由于是能量体，所以他们没有消化有机质的能力，但很明显他们不需要。他们无法抵御物理伤害，与此同时他们可以直接吸收热量。他们的眼睛与众不同。

origin.sil_yoni.fairy.name: 绿色仙子
origin.sil_yoni.fairy.description: 他们是森林的珍宝。经常会在空中进行快速冲刺，不过总是会因为他们脆弱的身体而停下。他们还擅长和自然打交道。
origin.sil_yoni.fairy2.name: 虚空仙子
origin.sil_yoni.fairy2.description: 世界的奇妙造物，也许在某一方面他们过于弱小，但他们也有着特殊的能力。
origin.sil_yoni.silvigarabis.name: Silvigarabis
origin.sil_yoni.silvigarabis.description: 这是作者写给自己玩的种族。

power.sil_yoni.freedom_flight.name: 自由飞行
power.sil_yoni.freedom_flight.description: 有什么事情比你能自由地翱翔于天空更让人开心呢！
power.sil_yoni.void_space.name: 进入到虚空的能力
power.sil_yoni.void_space.description: 你可以进入虚空空间。
power.sil_yoni.void_space.cooldown_deny_switch: 由于传送通道尚不稳定，无法切换空间。
power.sil_yoni.void_space.live_keep: 你在虚空空间里死亡了，被迫从中出来。
power.sil_yoni.void_space.leave.failed.noentrypoint: 没有找到出口。

power.sil_yoni.guxi.fire_light.enabled: 能量发送：始终在攻击时发送能量
power.sil_yoni.guxi.fire_light.disabled: 能量发送：仅在使用剑攻击时发送能量

power.sil_yoni.origin_spec/fairy/fairy_wings.name: 仙灵的翅膀
power.sil_yoni.origin_spec/fairy/fairy_wings.description: 你可以用你的翅膀飞行！不过不能飞太久，因为那可能让你的身体受伤。穿戴重甲也会加剧飞行时你的体力消耗。
power.sil_yoni.origin_spec/fairy/heal_magic.name: 治愈魔法
power.sil_yoni.origin_spec/fairy/heal_magic.description: 让你周围带上你的治疗魔法，并为自己增加临时的防护！
power.sil_yoni.origin_spec/fairy/fairy_physique.name: 仙子体质
power.sil_yoni.origin_spec/fairy/fairy_physique.description: 仙子的体质在各个方面都不算优秀……

power.sil_yoni.origin_spec/guxi0/guxi_physique.name: 咕西的体质
power.sil_yoni.origin_spec/guxi0/guxi_physique.description: 盔甲无法为你抵挡伤害；你没有进食的需求，因为你的身体并不与常人一致。
power.sil_yoni.origin_spec/guxi0/boost_to_sky_power_desc.name: 特殊能力：跳跃、飞行、滑翔
power.sil_yoni.origin_spec/guxi0/boost_to_sky_power_desc.description: 你可以消耗能量来将你送上天空或者滑翔。
power.sil_yoni.origin_spec/guxi0/fire_light_power_desc.name: 特殊能力：能量发送
power.sil_yoni.origin_spec/guxi0/fire_light_power_desc.description: 你可以将组成你的能量发送到外界。手持剑或镐使用。

power.sil_yoni.origin_spec/fairy2/fairy_wings.name: 膜翅
power.sil_yoni.origin_spec/fairy2/fairy_wings.description: 你的身体上生长着一对膜翅，你可以用它飞行一段时间，但是长时间的飞行会使你感到极度疲惫。
power.sil_yoni.origin_spec/fairy2/void_inventory.name: 虚空存储
power.sil_yoni.origin_spec/fairy2/void_inventory.description: 你可以利用虚空空间存储你的物品。

power.sil_yoni.origin_spec/silvigarabis/all.name: 一切的能力
power.sil_yoni.origin_spec/silvigarabis/all.description: 你给自己添加了太多的限制

