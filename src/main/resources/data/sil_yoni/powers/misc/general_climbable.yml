type: apoli:multiple
hidden: true
description: 通用攀爬能力，允许攀登一般方块（正确硬度小于20）

x-collision-condition: &block-hardness
   type: apoli:block_collision
   block_condition:
      type: apoli:and
      conditions:
         -  type: apoli:block
            inverted: true
            block: minecraft:air
         -  type: apoli:hardness
            comparison: "<"
            compare_to: 20
         -  type: apoli:hardness
            comparison: ">="
            compare_to: 0

x-wall-climbing-condition: &wall-climbing
   type: apoli:and
   conditions:
      -  type: apoli:collided_horizontally
      -
         type: apoli:or
         conditions:
            -  <<: *block-hardness
               offset_x: 0.1
            -  <<: *block-hardness
               offset_z: 0.1
            -  <<: *block-hardness
               offset_x: 0.1
               offset_y: -0.1
            -  <<: *block-hardness
               offset_z: 0.1
               offset_y: -0.1
            -  <<: *block-hardness
               offset_x: -0.1
            -  <<: *block-hardness
               offset_z: -0.1
            -  <<: *block-hardness
               offset_x: -0.1
               offset_y: -0.1
            -  <<: *block-hardness
               offset_z: -0.1
               offset_y: -0.1

x-start-climbing: &start-climbing
   type: apoli:resource
   resource: "*:*_start_climbing"
   comparison: '>'
   compare_to: 0

start_climbing:
   type: apoli:cooldown
   cooldown: 40

check_climbing:
   type: apoli:action_over_time
   interval: 20
   entity_action:
      type: apoli:if_else
      condition:
         type: apoli:climbing
      if_action:
         type: apoli:and
         actions:
#         -
#            type: apoli:execute_command
#            command: say climbing
         -
            type: apoli:trigger_cooldown
            power: "*:*_start_climbing"

walk_trigger:
   type: sil_yoni:detection/mutable_active_self
   condition:
      <<: *start-climbing
   interval: 10
   key:
      -
         key: key.right
         trigger: SINGLE_PRESS_HOLD_ALWAYS_CONTINUOUS
      -
         key: key.left
         trigger: SINGLE_PRESS_HOLD_ALWAYS_CONTINUOUS
      -
         key: key.back
         trigger: SINGLE_PRESS_HOLD_ALWAYS_CONTINUOUS
      -
         key: key.forward
         trigger: SINGLE_PRESS_HOLD_ALWAYS_CONTINUOUS
      -
         key: key.sneak
         trigger: SINGLE_PRESS_HOLD_ALWAYS_CONTINUOUS
      -
         key: key.jump
         trigger: SINGLE_PRESS_HOLD_ALWAYS_CONTINUOUS
   entity_action:
      type: apoli:trigger_cooldown
      power: "*:*_start_climbing"

jumping_trigger:
   type: sil_yoni:detection/mutable_active_self
   interval: 10
   key:
      key: key.jump
      trigger: SINGLE_PRESS_HOLD_ALWAYS_CONTINUOUS
   entity_action:
      type: apoli:trigger_cooldown
      power: "*:*_start_climbing"

ability:
   type: apoli:climbing
   allow_holding: true
   condition:
      type: apoli:and
      conditions:
         - <<: *start-climbing
         - <<: *wall-climbing
