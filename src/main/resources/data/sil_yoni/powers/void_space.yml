type: apoli:multiple

switch_cooldown:
    type: apoli:cooldown
    cooldown: 6000 # 300sec or 5min (max, usually set to 20sec or 400tick (-5600))
    hud_render:
        should_render: true
        bar_index: 1
        inverted: false

wait_for_trigger:
    type: sil_yoni:detection/mutable_active_self
    key:
        key: key.origins.secondary_active
        trigger: LONG_PRESS_10s
    entity_action:
        type: apoli:if_else
        condition:
            type: apoli:resource
            resource: "*:*_switch_cooldown"
            comparison: '>'
            compare_to: 0
        if_action:
            type: apoli:execute_command
            command: 'function sil_yoni:origin_power/void_space/cooldown_deny_switch'
        else_action:
            type: apoli:and
            actions:
            -  type: apoli:change_resource
               resource: "*:*_switch_cooldown"
               operation: set
               change: 5600
            -  type: apoli:if_else
               condition:
                  type: apoli:resource
                  resource: "*:extra/*/in_void_space"
                  comparison: '=='
                  compare_to: 0
               if_action:
                  type: apoli:grant_power
                  power: "*:extra/*/data"
                  source: "*:*"
               else_action:
                  type: apoli:revoke_power
                  power: "*:extra/*/data"
                  source: "*:*"

callbacks:
    type: origins:action_on_callback
    execute_chosen_when_orb: true
    entity_action_gained:
        type: apoli:and
        actions:
        -
            type: apoli:grant_power
            power: "*:extra/*/in_void_space"
            source: "*:*"
    entity_action_lost:
        type: apoli:and
        actions:
        -
            type: apoli:revoke_power
            power: "*:extra/*/data"
            source: "*:*"
        -
            type: apoli:revoke_power
            power: "*:extra/*/in_void_space"
            source: "*:*"

death_callback:
    type: apoli:prevent_death
    condition:
        type: apoli:resource
        resource: "*:extra/*/in_void_space"
        comparison: '=='
        compare_to: 1
    entity_action:
        type: apoli:and
        actions:
        -
            type: apoli:revoke_power
            power: "*:extra/*/data"
            source: "*:*"
        -
            type: apoli:trigger_cooldown
            power: "*:*_switch_cooldown"
        -
            type: apoli:change_resource
            resource: "*:extra/*/in_void_space"
            operation: set
            change: 0
        -
            type: apoli:clear_effect
        -
            type: apoli:extinguish
        -
            type: apoli:execute_command
            command: 'function sil_yoni:origin_power/void_space/live_keep'
