## 恢复
type: apoli:multiple
eat_fire:
   type: apoli:modify_damage_taken
   damage_condition:
      type: apoli:or
      conditions:
      -
         { type: "apoli:in_tag", tag: "is_fire" }
      -
         { type: "apoli:in_tag", tag: "is_lightning" }
   modifier:
      operation: multiply_total_multiplicative
      value: -1
   self_action:
      type: apoli:chance
      chance: 0.05
      action:
         type: apoli:feed
         food: 1
         saturation: 0

eat_fire_immu:
   type: apoli:effect_immunity
   effects:
   - minecraft:fire_resistance

eat_sun_light:
   type: apoli:action_over_time
   interval: 24
   condition:
      type: apoli:exposed_to_sun
   entity_action:
      type: apoli:feed
      food: 1
      saturation: 0

dense_energy_damage:
   type: apoli:modify_damage_taken
   damage_condition:
      type: apoli:and
      conditions:
      - { type: apoli:name, name: dense_energy }
      - { inverted: true, type: apoli:in_tag, tag: is_explosion }
   modifier:
      operation: multiply_total
      value: -0.9
   self_action:
      type: apoli:feed
      food: 8
      saturation: 0
