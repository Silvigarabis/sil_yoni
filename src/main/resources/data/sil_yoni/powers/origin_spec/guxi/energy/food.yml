# 食物修改
type: apoli:multiple
prevent_eat:
   type: apoli:prevent_item_use
   item_condition:
      type: apoli:and
      conditions:
      -
         type: apoli:food
      -
         type: apoli:ingredient
         ingredient: { tag: sil_yoni:food_with_energy }
         inverted: true
      -
         type: apoli:ingredient
         ingredient: { item: minecraft:potion }
         inverted: true
      -
         type: apoli:ingredient
         ingredient: { item: minecraft:suspicious_stew }
         inverted: true

modify_spec_food:
   type: apoli:modify_food
   item_condition:
      type: apoli:and
      conditions:
      -
         type: apoli:food
      -
         type: apoli:ingredient
         ingredient: { tag: sil_yoni:food_with_energy }
      -
         inverted: true
         type: origins:ingredient
         ingredient: { item: minecraft:suspicious_stew }
   food_modifier:
      operation: multiply_base_additive
      value: 9.3

decrease_suspicious_stew_food:
   type: apoli:modify_food
   item_condition:
      type: origins:ingredient
      ingredient: { item: minecraft:suspicious_stew }
   food_modifier:
      operation: addition
      value: -5

modify_food_eat_time:
   type: sil_yoni:modify/food_eat_time
   modifier:
     operation: set_total
     value: 0

modify_food_edible:
   type: apoli:modify_food
   always_edible: true
   condition:
      type: apoli:resource
      resource: sil_yoni:origins/guxi/energy_data
      comparison: '<'
      compare_to: 10000

   item_condition:
      type: apoli:and
      conditions:
      -
         type: apoli:food
      -
         type: apoli:or
         conditions:
         -
            type: apoli:ingredient
            ingredient: { tag: sil_yoni:food_with_energy }
         -
            type: apoli:ingredient
            ingredient: { item: minecraft:suspicious_stew }
