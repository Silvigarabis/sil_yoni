type: apoli:multiple
enable_normal:
   type: apoli:resource
   min: 0
   max: 1
   hud_render: { should_render: false }

force_enable_switcher:
   type: sil_yoni:detection/mutable_active_self
   key:
      key: key.origins.secondary_active
      trigger: DOUBLE_CLICK_INTERVAL
   entity_action:
      type: apoli:if_else
      condition:
         type: apoli:resource
         resource: "*:*_enable_normal"
         comparison: '=='
         compare_to: 0
      if_action:
         type: apoli:and
         actions:
         -
            type: apoli:execute_command
            command: 'function sil_yoni:origins/guxi/show_fire_light_on'
         -
            type: apoli:change_resource
            resource: "*:*_enable_normal"
            operation: set
            change: 1
      else_action:
         type: apoli:and
         actions:
         -
            type: apoli:execute_command
            command: 'function sil_yoni:origins/guxi/show_fire_light_off'
         -
            type: apoli:change_resource
            resource: "*:*_enable_normal"
            operation: set
            change: 0

# 一个通过左键触发的攻击技能
trigger_raycast_target:
   type: sil_yoni:detection/mutable_active_self
   cooldown: 3

   key:
      key: key.attack
      trigger: SINGLE_PRESS_HOLD_ALWAYS_CONTINUOUS

   # 必须在手动开启或手持剑时才会触发
   # 必须还有能量
   condition:
      type: apoli:and
      conditions:
      -
         type: apoli:or
         conditions:
         -
            type: apoli:equipped_item
            equipment_slot: mainhand
            item_condition:
               type: apoli:ingredient
               ingredient: { tag: swords }
         -
            type: apoli:resource
            resource: "*:*_enable_normal"
            comparison: '=='
            compare_to: 1
      -
         type: apoli:food_level
         comparison: ">"
         compare_to: 0

   entity_action:
      # 进行一次直线查找，在60内找直直对着的实体
      type: origins:raycast
      distance: 60
      block: false
      entity: true
      fluid_handling: none
      bientity_condition:
         type: apoli:target_condition
         condition:
            type: apoli:living

      # 找到了就消耗能量，向目标实体发出攻击
      bientity_action:
         type: apoli:and
         actions:
         -
            type: apoli:actor_action
            action:
               type: apoli:exhaust
               amount: 8
         -
            type: apoli:damage
            damage_type: sil_yoni:dense_energy
            amount: 8

      # 没有找到这类实体，尝试提高查找范围
      miss_action:
         # 进行一次直线查找，在180内找直直对着的实体
         type: origins:raycast
         distance: 180
         block: false
         entity: true
         fluid_handling: none
         bientity_condition:
            type: apoli:target_condition
            condition:
               type: apoli:living

         # 找到了就消耗能量，向目标实体发出攻击
         bientity_action:
            type: apoli:and
            actions:
            -
               type: apoli:actor_action
               action:
                  type: apoli:exhaust
                  amount: 18
            -
               type: apoli:damage
               damage_type: sil_yoni:dense_energy
               amount: 8

         # 没有找到这类实体，使用范围攻击模式
         miss_action:
            type: apoli:and
            actions:
            # 先消耗一点能量用于查找
            -
               type: apoli:exhaust
               amount: 0.5

            # 开始查找并攻击 
            -
               type: apoli:area_of_effect
               radius: 12

               bientity_condition:
                  type: apoli:and
                  conditions:
                  # 首先得是活体
                  -
                     type: apoli:target_condition
                     condition:
                        type: apoli:living

                  # 然后进行类别查找
                  -
                     type: apoli:or
                     conditions:
                     # 第一种成功情况：距离4格内曾被我攻击的生物，或曾攻击过我的生物
                     -
                        type: apoli:and
                        conditions:
                        -
                           type: apoli:or
                           conditions:
                           - { type: apoli:invert, condition: { type: apoli:attacker } }
                           - { type: apoli:attacker }
                        - { type: apoli:distance, comparison: '<=', compare_to: 4 }

                     # 第二种成功情况：整个查找范围内
                     #  战斗情况：想以我为目标的、我目标的、攻击我的、我攻击的实体，
                     #  视角情况：差不多正看着他
                     -
                        type: apoli:and
                        conditions:
                        # 战斗情况的检测的检测
                        -
                           type: apoli:or
                           conditions:
                           - { type: apoli:invert, condition: { type: apoli:attack_target } }
                           - { type: apoli:invert, condition: { type: apoli:attacker } }
                           - { type: apoli:attack_target }
                           - { type: apoli:attacker }

                        # 视角情况的检测
                        -
                           type: apoli:or
                           conditions:
                           # 对玩家实体要求更高的精确度，为了PVP公平性
                           -
                              type: apoli:and
                              conditions:
                              -
                                 type: apoli:target_condition
                                 condition:
                                    type: apoli:entity_type
                                    entity_type: player
                              -
                                 type: origins:relative_rotation
                                 actor_rotation: head
                                 target_rotation: head
                                 comparison: "<="
                                 compare_to: -0.7

                           # 对一般实体要求一般精确度
                           -
                              type: apoli:and
                              conditions:
                              -
                                 type: apoli:target_condition
                                 condition:
                                    type: apoli:entity_type
                                    entity_type: player
                                    inverted: true
                              -
                                 type: origins:relative_rotation
                                 actor_rotation: head
                                 target_rotation: head
                                 comparison: "<="
                                 compare_to: -0.3

               # 对找到的实体使用能量进行伤害
               bientity_action:
                  type: apoli:and
                  actions:
                  # 能量消耗
                  -
                     type: apoli:actor_action
                     action:
                        type: apoli:exhaust
                        amount: 6
                  # 造成伤害
                  -
                     type: apoli:damage
                     damage_type: sil_yoni:dense_energy
                     amount: 8
