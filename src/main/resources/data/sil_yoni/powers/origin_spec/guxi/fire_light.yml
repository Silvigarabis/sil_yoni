type: apoli:multiple
enable_normal:
   type: apoli:resource
   min: 0
   max: 1
   hud_render: { should_render: false }

trigger:
   type: apoli:active_self
   cooldown: 3
   key:
      key: key.attack
      continuous: true
   condition:
      type: apoli:and
      conditions:
      -
         type: apoli:or
         conditions:
         -
            type: apoli:equipped_item
            equipment_slot: mainhand
            item_condition:
               type: apoli:ingredient
               ingredient: { tag: swords }
         -
            type: apoli:resource
            resource: "*:*_enable_normal"
            comparison: '=='
            compare_to: 1
      -
         type: apoli:food_level
         comparison: ">"
         compare_to: 0

   entity_action:
      type: origins:raycast
      distance: 80
      block: false
      entity: true
      fluid_handling: none

      hit_action:
         type: apoli:exhaust
         amount: 32

      bientity_action:
         type: apoli:damage
         damage_type: sil_yoni:dense_energy
         amount: 8

      miss_action:
         type: apoli:and
         actions:
         -
            type: apoli:exhaust
            amount: 0.2
         -
            type: origins:area_of_effect
            radius: 12

            bientity_condition:
               type: origins:and
               conditions:
               - 
                  # axes: [ y ]
                  type: origins:relative_rotation
                  actor_rotation: head
                  target_rotation: body
                  comparison: "<="
                  compare_to: -0.5
               - 
                  type: apoli:or
                  conditions: 
                     -  type: apoli:attack_target
                     -  type: apoli:attacker

            bientity_action:
               type: apoli:and
               actions:
               -
                  type: apoli:damage
                  damage_type: sil_yoni:dense_energy
                  amount: 8
               -
                  type: apoli:actor_action
                  action:
                     type: apoli:exhaust
                     amount: 32

