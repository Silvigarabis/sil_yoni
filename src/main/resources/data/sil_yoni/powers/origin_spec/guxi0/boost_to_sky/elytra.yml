type: apoli:multiple
equip:
  type: apoli:elytra_flight
  render_elytra: true
energy_lost:
  type: apoli:damage_over_time
  interval: 600
  onset_delay: 100
  damage: 1
  damage_type: sil_yoni:guxi_starve_energy
flight:
  type: apoli:active_self
  cooldown: 17
  key:
    key: key.jump
    continuous: true
  condition:
    type: apoli:fall_flying
  entity_action:
    type: apoli:and
    actions:
      - type: apoli:chance
        chance: 0.22
        action:
          type: apoli:damage
          amount: 1
          damage_type: sil_yoni:guxi_starve_energy
      - type: apoli:add_velocity
        'y': 0.4
      - type: apoli:add_velocity
        space: local
        z: 0.09
