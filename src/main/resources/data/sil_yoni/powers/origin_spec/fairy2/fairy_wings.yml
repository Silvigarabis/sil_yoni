type: apoli:multiple

callbacks:
  type: origins:action_on_callback
  execute_chosen_when_orb: true
  entity_action_gained:
    type: apoli:and
    actions:
      - type: apoli:change_resource
        resource: "*:*_energy"
        operation: set
        change: 48
      - type: apoli:grant_power
        power: sil_yoni:condition/condition_wear_light_armor
        source: "*:*"
      - type: apoli:grant_power
        power: sil_yoni:condition/condition_wear_heavy_armor
        source: "*:*"
  entity_action_respawned:
    type: apoli:and
    actions:
      - type: apoli:change_resource
        resource: "*:*_energy"
        operation: set
        change: 48
  entity_action_lost:
    type: apoli:and
    actions:
      - type: apoli:revoke_power
        power: sil_yoni:condition/condition_wear_light_armor
        source: "*:*"
      - type: apoli:revoke_power
        power: sil_yoni:condition/condition_wear_heavy_armor
        source: "*:*"

# 在运行时阻止此能力的主动使用
# 人话：不让玩家飞，但是其他不变
flag_disable_wings:
  type: apoli:resource
  min: 0
  max: 1
  start_value: 0

# 阻止能量回复
flag_disable_recure:
  type: apoli:resource
  min: 0
  max: 1
  start_value: 0

# 能量是否可以自然恢复
flag_can_recure_energy:
  type: apoli:resource
  min: 0
  max: 1
  start_value: 0

# 是否允许玩家使用
flag_can_use_wings:
  type: apoli:resource
  min: 0
  max: 1
  start_value: 1
  
# 当前的情景是否支持玩家使用
# 或者说，这个时候玩家会有可能使用翅膀吗？
flag_should_use_wings:
  type: apoli:resource
  min: 0
  max: 1
  start_value: 0
  
broken_wings_recover_timer:
  type: apoli:cooldown
  cooldown: 1000

energy:
  type: apoli:resource
  min: -5
  max: 48
  start_value: 48
  hud_render:
    should_render: true
    condition:
      type: apoli:or
      conditions:
      -  type: apoli:ability
         ability: minecraft:flying
      -  type: apoli:resource
         resource: "*:*_energy"
         comparison: "<"
         compare_to: 48
    sprite_location: origins:textures/gui/community/spiderkolo/resource_bar_01.png
    bar_index: 12

status_uodater_flag_can_recure_energy:
   type: apoli:action_over_time
   interval: 1
   entity_action:
      type: apoli:if_else
      condition:
         type: apoli:and
         conditions:
         -  type: apoli:resource
            resource: "*:*_energy"
            comparison: "<"
            compare_to: 48
         -
            type: apoli:or
            conditions:
            -
               type: apoli:on_block
            -
               type: apoli:and
               conditions:
               - { type: apoli:gamemode, inverted: true, gamemode: survival }
               - { type: apoli:gamemode, inverted: true, gamemode: adventure }
         -
            type: apoli:resource
            resource: "*:*_flag_disable_recure"
            comparison: "=="
            compare_to: 0
         -
            type: apoli:resource
            resource: "*:*_flag_can_use_wings"
            comparison: "=="
            compare_to: 1
      if_action:
         type: apoli:change_resource
         resource: "*:*_flag_can_recure_energy"
         operation: set
         change: 1
      else_action:
         type: apoli:change_resource
         resource: "*:*_flag_can_recure_energy"
         operation: set
         change: 0

status_uodater_flag_can_use_wings:
   type: apoli:action_over_time
   interval: 1
   entity_action:
      type: apoli:if_else
      condition:
         type: apoli:and
         conditions:
         -
            type: apoli:resource
            resource: "*:*_broken_wings_recover_timer"
            comparison: "=="
            compare_to: 0
         -
            type: apoli:resource
            resource: "*:*_energy"
            comparison: ">"
            compare_to: -5
      if_action:
         type: apoli:change_resource
         resource: "*:*_flag_can_use_wings"
         operation: set
         change: 1
      else_action:
         type: apoli:change_resource
         resource: "*:*_flag_can_use_wings"
         operation: set
         change: 0

status_uodater_flag_should_use_wings:
   type: apoli:action_over_time
   interval: 1
   entity_action:
      type: apoli:if_else
      condition:
         type: apoli:and
         conditions:
         -
            type: apoli:command
            command: data get entity @s SleepTimer
            comparison: '=='
            compare_to: 0
         -  { type: apoli:riding, inverted: true }
         -
            type: apoli:or
            conditions:
            - { type: apoli:gamemode, gamemode: survival }
            - { type: apoli:gamemode, gamemode: adventure }
      if_action:
         type: apoli:change_resource
         resource: "*:*_flag_should_use_wings"
         operation: set
         change: 1
      else_action:
         type: apoli:change_resource
         resource: "*:*_flag_should_use_wings"
         operation: set
         change: 0

wings_ability_mayfly:
  type: apoli:creative_flight
  condition:
    type: apoli:and
    conditions:
      -
         type: apoli:in_block
         block_condition:
            type: apoli:fluid
            fluid_condition: { type: apoli:empty }
            #inverted: true
      - type: apoli:resource
        resource: "*:*_flag_can_use_wings"
        comparison: '=='
        compare_to: 1
      - type: apoli:resource
        resource: "*:*_flag_disable_wings"
        comparison: '=='
        compare_to: 0

wings_health:
  type: apoli:conditioned_attribute
  tick_rate: 50
  condition:
     type: apoli:resource
     resource: "*:*_flag_can_use_wings"
     comparison: '=='
     compare_to: 1
  modifiers:
    - attribute: generic.max_health
      operation: addition
      value: 4
      name: "*:*"

falldown:
   type: apoli:modify_falling
   take_fall_damage: false
   velocity: 0.06
   condition:
      type: apoli:and
      conditions:
      -
         type: apoli:status_effect
         effect: minecraft:slow_falling
         inverted: true
      -
         type: apoli:resource
         resource: "*:*_flag_can_use_wings"
         comparison: '=='
         compare_to: 1

# 用力过度状态
hurted_wings_no_move:
   type: apoli:conditioned_attribute
   tick_rate: 30
   condition:
      type: apoli:resource
      resource: "*:*_flag_can_use_wings"
      comparison: '=='
      compare_to: 0
   modifiers:
   -
      attribute: generic.movement_speed
      operation: multiply_total
      value: -0.95
      name: "*:*"
hurted_wings_no_move_jumping:
   type: apoli:modify_jump
   condition:
      type: apoli:resource
      resource: "*:*_flag_can_use_wings"
      comparison: '=='
      compare_to: 0
   modifier:
     operation: multiply_total_multiplicative
     value: -0.95
     name: "*:*"
hurted_wings_status:
   type: apoli:action_over_time
   condition:
      type: apoli:resource
      resource: "*:*_flag_can_use_wings"
      comparison: '=='
      compare_to: 0
   interval: 40
   entity_action:
      type: apoli:apply_effect
      effect:
         effect: minecraft:blindness
         duration: 800
         show_particles: false
         show_icon: false

# 能量回复逻辑
restoring_energy:
   type: apoli:action_over_time
   interval: 30
   condition:
      type: apoli:resource
      resource: "*:*_flag_can_recure_energy"
      comparison: '=='
      compare_to: 1
   entity_action:
      type: apoli:and
      actions:
      -
         type: apoli:if_else
         condition:
            type: apoli:ability
            ability: minecraft:flying
            inverted: true
         # 恢复能量
         if_action:
            type: apoli:change_resource
            resource: "*:*_energy"
            operation: add
            change: 1

# 飞行时消耗能量
decease_energy:
   type: apoli:action_over_time
   interval: 30
   condition:
      type: apoli:and
      conditions:
      -
         type: apoli:resource
         resource: "*:*_flag_can_use_wings"
         comparison: '=='
         compare_to: 1
      -
         type: apoli:resource
         resource: "*:*_flag_should_use_wings"
         comparison: '=='
         compare_to: 1
   entity_action:
      type: apoli:and
      actions:
      -
         type: apoli:if_else
         condition:
            type: apoli:ability
            ability: minecraft:flying
         if_action:
            type: apoli:chance
            chance: 0.33
            action:
               type: apoli:change_resource
               resource: "*:*_energy"
               operation: add
               change: -2
            fail_action:
               type: apoli:change_resource
               resource: "*:*_energy"
               operation: add
               change: -1
      # -
         # type: apoli:if_else
         # condition:
            # type: apoli:attribute
            # attribute: minecraft:generic.armor
            # comparison: '>'
            # compare_to: 9
            # if_action:
               # type: apoli:change_resource
               # resource: "*:*_energy"
               # operation: add
               # change: -1
      -
         type: apoli:if_else
         condition:
            type: apoli:resource
            resource: "*:*_energy"
            comparison: '=='
            compare_to: -5
         if_action:
            type: apoli:trigger_cooldown
            power: "*:*_broken_wings_recover_timer"

# 过度用力之后的恢复
broken_wings_recover:
   type: apoli:action_over_time
   interval: 100
   condition:
      type: apoli:and
      conditions:
      -
         type: apoli:resource
         resource: "*:*_flag_can_use_wings"
         comparison: '=='
         compare_to: 0
      -
         type: apoli:resource
         resource: "*:*_broken_wings_recover_timer"
         comparison: '=='
         compare_to: 0
   entity_action:
      type: apoli:change_resource
      resource: "*:*_energy"
      operation: set
      change: 0

# 低能量状态
tired_wings:
   type: apoli:action_over_time
   interval: 20
   condition:
      type: apoli:and
      conditions:
      -
         type: apoli:resource
         resource: "*:*_flag_can_use_wings"
         comparison: '=='
         compare_to: 1
      -
         type: apoli:resource
         resource: "*:*_energy"
         comparison: '<='
         compare_to: 0
   entity_action:
      type: apoli:apply_effect
      effects:
      -
         effect: minecraft:slowness
         duration: 60
         amplifier: 2
         show_particles: false
         show_icon: false
      -
         effect: minecraft:blindness
         duration: 30
         show_particles: false
         show_icon: false

particle_effect:
  type: apoli:action_over_time
  interval: 12
  condition:
    type: apoli:and
    conditions:
      -
         type: apoli:resource
         resource: "*:*_flag_can_use_wings"
         comparison: '=='
         compare_to: 1
      -
         type: apoli:ability
         ability: minecraft:flying
  entity_action:
    type: apoli:spawn_particles
    frequency: 5
    particle:
      type: minecraft:dust
      params: 0.78 0.78 0.78 0.5
    spread:
      x: 0.1
      y: 0.09
      z: 0.1
    offset_y: 0.13
    speed: 1
    count: 10
    force: true

