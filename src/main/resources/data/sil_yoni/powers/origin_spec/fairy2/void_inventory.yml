type: origins:multiple
badges:
-  sil_yoni:triple_click_active
-  sil_yoni:only_usable_in_void_space
container_data:
   type: origins:inventory
   title: container.sil_yoni:void_inventory
   recoverable: false
   drop_on_death: false
   container_type: double_chest
   key:
      key: key.origins.secondary_active
   condition:
      type: origins:and
      conditions:
      -  type: origins:resource
         resource: sil_yoni:extra/void_space/in_void_space
         comparison: '=='
         compare_to: 1
      -  type: origins:resource
         resource: "*:*/trigger"
         comparison: '>'
         compare_to: 0

callbacks:
   type: origins:action_on_callback
   execute_chosen_when_orb: true
   entity_action_gained:
      type: apoli:and
      actions:
         -
            type: apoli:grant_power
            power: "*:*/trigger"
            source: "*:*"
   entity_action_lost:
      type: apoli:and
      actions:
         -
            type: apoli:revoke_power
            power: "*:*/trigger"
            source: "*:*"
