type: apoli:multiple
energy:
  type: apoli:resource
  min: -5
  max: 24
  start_value: 24
  hud_render:
    should_render: true
    condition:
      type: apoli:or
      conditions:
        - type: apoli:ability
          ability: minecraft:flying
        - type: apoli:resource
          resource: "*:*_energy"
          comparison: <
          compare_to: 24
    sprite_location: origins:textures/gui/community/spiderkolo/resource_bar_01.png
    bar_index: 12
callbacks:
  type: origins:action_on_callback
  execute_chosen_when_orb: true
  entity_action_gained:
    type: apoli:and
    actions:
      - type: apoli:change_resource
        resource: "*:*_energy"
        operation: set
        change: 24
      - type: apoli:grant_power
        power: sil_yoni:fluttering_wings
        source: "*:*"
      - type: apoli:grant_power
        power: sil_yoni:condition/condition_wear_light_armor
        source: "*:*"
      - type: apoli:grant_power
        power: sil_yoni:condition/condition_wear_heavy_armor
        source: "*:*"
  entity_action_respawned:
    type: apoli:and
    actions:
      - type: apoli:change_resource
        resource: "*:*_energy"
        operation: set
        change: 24
  entity_action_lost:
    type: apoli:and
    actions:
      - type: apoli:revoke_power
        power: sil_yoni:fluttering_wings
        source: "*:*"
      - type: apoli:revoke_power
        power: sil_yoni:condition/condition_wear_light_armor
        source: "*:*"
      - type: apoli:revoke_power
        power: sil_yoni:condition/condition_wear_heavy_armor
        source: "*:*"
wings_ability_mayfly:
  type: apoli:creative_flight
  condition:
    type: apoli:and
    conditions:
      - type: apoli:in_block
        block_condition:
          type: apoli:fluid
          fluid_condition:
            type: apoli:or
            conditions:
              - type: apoli:in_tag
                tag: minecraft:water
              - type: apoli:in_tag
                tag: minecraft:lava
        inverted: true
      - type: apoli:resource
        resource: "*:*_energy"
        comparison: '>'
        compare_to: -5
wings_health:
  type: apoli:conditioned_attribute
  tick_rate: 50
  condition:
    type: apoli:ability
    ability: minecraft:mayfly
  modifiers:
    - attribute: generic.max_health
      operation: addition
      value: 10
      name: sil_yoni:origin_spec/fairy/fairy_wings
fly_no_falling_damage:
  type: apoli:invulnerability
  condition:
    type: apoli:ability
    ability: minecraft:mayfly
  damage_condition:
    type: apoli:name
    name: fall
hurted_wings_no_move:
  type: apoli:conditioned_attribute
  tick_rate: 30
  condition:
    type: apoli:resource
    resource: "*:*_energy"
    comparison: '=='
    compare_to: -5
  modifiers:
    - attribute: generic.movement_speed
      operation: multiply_total
      value: -0.95
      name: sil_yoni:origin_spec/fairy/fairy_wings
hurted_wings_no_move_jumping:
  type: apoli:modify_jump
  condition:
    type: apoli:resource
    resource: "*:*_energy"
    comparison: '=='
    compare_to: -5
  modifier:
    operation: multiply_total_multiplicative
    value: -0.95
    name: sil_yoni:origin_spec/fairy/physique/fairy_wings
restoring_energy:
  type: apoli:action_over_time
  interval: 30
  condition:
    type: apoli:and
    conditions:
      - type: apoli:ability
        ability: minecraft:mayfly
  entity_action:
    type: apoli:and
    actions:
      - type: apoli:if_else
        condition:
          type: apoli:biome
          condition:
            type: apoli:category
            category: forest
        if_action:
          type: apoli:change_resource
          resource: "*:*_energy"
          operation: add
          change: 1
      - type: apoli:if_else
        condition:
          type: apoli:or
          conditions:
            - type: apoli:ability
              inverted: true
              ability: minecraft:flying
            - type: apoli:gamemode
              gamemode: creative
        if_action:
          type: apoli:if_else
          condition:
            type: apoli:or
            conditions:
              - type: apoli:resource
                resource: "*:*_energy"
                comparison: <
                compare_to: 0
              - type: apoli:health
                comparison: '>='
                compare_to: 3
          if_action:
            type: apoli:if_else
            condition:
              type: apoli:attribute
              attribute: minecraft:generic.armor
              comparison: '>'
              compare_to: 9
            if_action:
              type: apoli:chance
              chance: 0.4
              action:
                type: apoli:change_resource
                resource: "*:*_energy"
                operation: add
                change: 1
              fail_action:
                type: apoli:nothing
            else_action:
              type: apoli:chance
              chance: 0.66
              action:
                type: apoli:change_resource
                resource: "*:*_energy"
                operation: add
                change: 1
              fail_action:
                type: apoli:nothing
        else_action:
          type: apoli:and
          actions:
            - type: apoli:chance
              chance: 0.33
              action:
                type: apoli:change_resource
                resource: "*:*_energy"
                operation: add
                change: -2
              fail_action:
                type: apoli:change_resource
                resource: "*:*_energy"
                operation: add
                change: -1
            - type: apoli:if_else
              condition:
                type: apoli:attribute
                attribute: minecraft:generic.armor
                comparison: '>'
                compare_to: 9
              if_action:
                type: apoli:change_resource
                resource: "*:*_energy"
                operation: add
                change: -1
      - type: apoli:if_else
        condition:
          type: apoli:and
          conditions:
            - type: apoli:resource
              resource: "*:*_energy"
              comparison: '=='
              compare_to: -5
            - type: apoli:resource
              resource: "*:*_broken_wings_recover_timer"
              comparison: '=='
              compare_to: 0
        if_action:
          type: apoli:trigger_cooldown
          power: "*:*_broken_wings_recover_timer"
broken_wings_recover_timer:
  type: apoli:cooldown
  cooldown: 1000
broken_wings_recover:
  type: apoli:action_over_time
  interval: 1
  condition:
    type: apoli:and
    conditions:
      - type: apoli:resource
        resource: "*:*_energy"
        comparison: '=='
        compare_to: -5
      - type: apoli:resource
        resource: "*:*_broken_wings_recover_timer"
        comparison: '=='
        compare_to: 0
  entity_action:
    type: apoli:and
    actions:
      - type: apoli:change_resource
        resource: "*:*_energy"
        operation: set
        change: 0
      - type: apoli:apply_effect
        effect:
          effect: minecraft:blindness
          duration: 800
          show_particles: false
          show_icon: false
tired_wings:
  type: apoli:action_over_time
  interval: 15
  condition:
    type: apoli:resource
    resource: "*:*_energy"
    comparison: <
    compare_to: 0
  entity_action:
    type: apoli:apply_effect
    effects:
      - effect: minecraft:slowness
        duration: 60
        amplifier: 2
        show_particles: false
        show_icon: false
      - effect: minecraft:blindness
        duration: 30
        show_particles: false
        show_icon: false
particle_effect:
  type: apoli:action_over_time
  interval: 12
  condition:
    type: apoli:and
    conditions:
      - type: apoli:ability
        ability: minecraft:flying
  entity_action:
    type: apoli:spawn_particles
    frequency: 5
    particle:
      type: minecraft:dust
      params: 1 1 0.25 1
    spread:
      x: 0.1
      'y': 0.09
      z: 0.1
    offset_y: 0.17
    speed: 1
    count: 10
    force: true
wings_mix:
  type: apoli:action_over_time
  interval: 15
  entity_action:
    type: apoli:if_else
    condition:
      type: apoli:and
      conditions:
        - type: apoli:riding
          inverted: true
        - type: apoli:ability
          inverted: true
          ability: minecraft:flying
        - type: apoli:resource
          resource: "*:*_energy"
          comparison: '!='
          compare_to: -5
    else_action:
      type: apoli:if_else
      condition:
        type: apoli:power
        power: sil_yoni:fluttering_wings
        source: "*:*"
      if_action:
        type: apoli:revoke_power
        power: sil_yoni:fluttering_wings
        source: "*:*"
    if_action:
      type: apoli:if_else
      condition:
        type: apoli:and
        conditions:
          - type: apoli:resource
            resource: "*:*_energy"
            comparison: '>='
            compare_to: 0
          - type: apoli:power
            power: sil_yoni:fluttering_wings
            inverted: true
            source: "*:*"
      if_action:
        type: apoli:grant_power
        power: sil_yoni:fluttering_wings
        source: "*:*"


decreaseing_energy_when_direct_fly:
  type: apoli:active_self
  key:
    key: key.jump
    continuous: true
  cooldown: 7
  hud_render:
    should_render: false
  condition:
    type: apoli:and
    conditions:
      - type: apoli:power
        power: sil_yoni:fluttering_wings
        source: "*:*"
      - inverted: true
        type: apoli:gamemode
        gamemode: creative
      - type: apoli:command
        command: data get entity @s SleepTimer
        comparison: '=='
        compare_to: 0
  entity_action:
    type: apoli:and
    actions:
      - type: apoli:change_resource
        resource: "*:*_energy"
        operation: add
        change: -1
      - type: apoli:if_else
        condition:
          type: apoli:and
          conditions:
            - type: apoli:resource
              resource: "*:*_energy"
              comparison: '=='
              compare_to: -5
            - type: apoli:resource
              resource: "*:*_broken_wings_recover_timer"
              comparison: '=='
              compare_to: 0
        if_action:
          type: apoli:trigger_cooldown
          power: "*:*_broken_wings_recover_timer"
