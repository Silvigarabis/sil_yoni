type: apoli:multiple

hud:
  type: apoli:resource
  start_value: 0
  min: 0
  max: 100
  hud_render:
    should_render: true

test_power1:
  type: sil_yoni:misc/convert_food_to_resource
  resource: "*:*_hud"
  scale: 1

static_hunger:
  type: sil_yoni:misc/static_hunger
  static_food_level: false
  static_saturation_level: true
  food_level: 10
  saturation_level: 20

map_to:
  type: sil_yoni:misc/map_resource_ratio_to_food_level
  resource: "*:*_hud"
