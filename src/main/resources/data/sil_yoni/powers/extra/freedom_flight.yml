boost_forward:
   type: apoli:active_self
   key:
      key: key.forward
      continuous: true
   entity_action:
      type: apoli:and
      actions:
      -
         type: apoli:if_else
         condition:
            type: apoli:sprinting
         if_action:
            type: apoli:and
            actions:
            -
               type: apoli:add_velocity
               space: local
               z: 0.6
         else_action:
            type: apoli:and
            actions:
            -
               type: apoli:add_velocity
               space: local
               z: 0.025

go_back:
   type: apoli:active_self
   key:
      key: key.back
      continuous: true
   entity_action:
      type: apoli:and
      actions:
      # -  type: apoli:change_resource
         # resource: "*:*_action_lasting_time"
         # operation: set
         # change: 0
      -  type: apoli:change_resource
         resource: "*:*_move_lasting_time"
         operation: set
         change: 0
      -
         type: apoli:add_velocity
         space: local_horizontal
         z: -0.025

