left:
   type: apoli:active_self
   key:
      key: key.left
      continuous: true
   entity_action:
      type: apoli:and
      actions:
      -
         type: apoli:change_resource
         resource: "*:*_auto_stop"
         operation: set
         change: 0
      -
         type: apoli:add_velocity
         space: local_horizontal
         x: 0.03

right:
   type: apoli:active_self
   key:
      key: key.right
      continuous: true
   entity_action:
      type: apoli:and
      actions:
      -
         type: apoli:change_resource
         resource: "*:*_auto_stop"
         operation: set
         change: 0
      -
         type: apoli:add_velocity
         space: local_horizontal
         x: -0.03

go_back:
   type: apoli:active_self
   key:
      key: key.back
      continuous: true
   entity_action:
      type: apoli:and
      actions:
      -
         type: apoli:change_resource
         resource: "*:*_auto_stop"
         operation: set
         change: 0
      -
         type: apoli:delay
         ticks: 5
         action:
            type: apoli:add_velocity
            space: local_horizontal
            set: true
            z: -0.05

down_dynamic:
   type: apoli:active_self
   key:
      key: key.sneak
      continuous: true
   condition:
      type: apoli:moving
   entity_action:
      type: apoli:and
      actions:
         -
            type: apoli:change_resource
            resource: "*:*_auto_stop"
            operation: set
            change: 0
         -
            type: apoli:add_velocity
            space: world
            y: -0.1
up_dynamic:
   type: apoli:active_self
   key:
      key: key.jump
      continuous: true
   condition:
      type: apoli:moving
   entity_action:
      type: apoli:and
      actions:
         -
            type: apoli:change_resource
            resource: "*:*_auto_stop"
            operation: set
            change: 0
         -
            type: apoli:add_velocity
            space: world
            y: 0.2

down_static:
   type: apoli:active_self
   key:
      key: key.sneak
      continuous: true
   condition:
      type: apoli:moving
      inverted: true
   entity_action:
      type: apoli:and
      actions:
         -
            type: apoli:change_resource
            resource: "*:*_auto_stop"
            operation: set
            change: 0
         -
            type: apoli:add_velocity
            space: world
            set: true
            y: -0.15
up_static:
   type: apoli:active_self
   key:
      key: key.jump
      continuous: true
   condition:
      type: apoli:moving
      inverted: true
   entity_action:
      type: apoli:and
      actions:
         -
            type: apoli:change_resource
            resource: "*:*_auto_stop"
            operation: set
            change: 0
         -
            type: apoli:add_velocity
            space: world
            set: true
            y: 0.25
