type: apoli:multiple

no_fall:
    type: apoli:modify_falling
    take_fall_damage: false
    velocity: 0
auto_stop:
   type: apoli:resource
   min: 0
   max: 40
   start_value: 0
   max_action:
      type: apoli:and
      actions:
      -
         type: apoli:add_velocity
         space: world
         set: true
         x: 0
         y: 0
         z: 0

auto_stop_reset_timer:
   type: apoli:action_over_time
   interval: 1
   entity_action:
      type: apoli:change_resource
      resource: "*:*_auto_stop"
      operation: add
      change: 1

boost_forward:
   type: apoli:active_self
   key:
      key: key.forward
      continuous: true
   entity_action:
      type: apoli:and
      actions:
      -
         type: apoli:change_resource
         resource: "*:*_auto_stop"
         operation: set
         change: 0
      -
         type: apoli:if_else
         condition:
            type: apoli:sprinting
         if_action:
            type: apoli:and
            actions:
            -
               type: apoli:add_velocity
               space: local
               z: 0.6
         else_action:
            type: apoli:and
            actions:
            -
               type: apoli:add_velocity
               space: local
               z: 0.025

# stop:
   # type: apoli:active_self
