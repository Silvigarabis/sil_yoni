type: apoli:multiple
flight:
  type: apoli:active_self
  key:
    key: key.jump
    continuous: true
  condition:
    type: apoli:and
    conditions:
      - type: apoli:food_level
        comparison: '>'
        compare_to: 0
  entity_action:
    type: apoli:and
    actions:
      - type: apoli:exhaust
        amount: 0.05
      - type: apoli:apply_effect
        effect:
          effect: minecraft:levitation
          duration: 3
          amplifier: 4
          show_particles: false
          show_icon: false
auto_setup_triggers:
  type: apoli:action_over_time
  interval: 2
  entity_action:
    type: apoli:if_else
    condition:
      type: apoli:and
      conditions:
        - type: apoli:on_block
          inverted: true
        - type: apoli:riding
          inverted: true
        - type: apoli:command
          command: data get entity @s SleepTimer
          comparison: '=='
          compare_to: 0
    if_action:
      type: apoli:if_else
      condition:
        type: apoli:power
        inverted: true
        power: "*:extra/*"
        source: "*:*"
      if_action:
        type: apoli:grant_power
        power: "*:extra/*"
        source: "*:*"
    else_action:
      type: apoli:if_else
      condition:
        type: apoli:power
        power: "*:extra/*"
        source: "*:*"
      if_action:
        type: apoli:revoke_power
        power: "*:extra/*"
        source: "*:*"
auto_remove_triggers:
  type: apoli:action_on_callback
  execute_chosen_when_orb: true
  entity_action_lost:
    type: apoli:and
    actions:
      - type: apoli:revoke_power
        power: "*:extra/*"
        source: "*:*"
