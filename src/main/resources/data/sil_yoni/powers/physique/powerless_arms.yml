type: apoli:multiple
force_state:
   # 0 默认
   # -1 强制禁用
   # 1 强制启用状态1
   # 2 强制启用状态2
   type: apoli:resource
   min: -1
   max: 2
   start_value: 0

with_no_strength_effect:
   type: apoli:modify_break_speed
   condition:
      type: apoli:or
      conditions:
      - 
         type: apoli:resource
         resource: "*:*_force_state"
         comparison: '=='
         compare_to: 1
      -
         type: apoli:and
         conditions:
         - 
            type: apoli:resource
            resource: "*:*_force_state"
            comparison: '>='
            compare_to: 0
         -
            inverted: true
            type: apoli:status_effect
            effect: minecraft:strength
   block_condition:
      type: apoli:and
      conditions:
      -
         type: apoli:hardness
         comparison: ">"
         compare_to: 0
      -
         type: apoli:adjacent
         adjacent_condition:
            type: apoli:and
            conditions:
            -
               type: apoli:fluid
               fluid_condition: { type: apoli:empty }
            -
               type: apoli:hardness
               comparison: ">="
               compare_to: 1.5
         comparison: '>='
         compare_to: 4
   modifier:
     operation: multiply_base_multiplicative
     value: -1
     name: sil_yoni:physique/powerless_arms

with_strength_effect:
   type: apoli:modify_break_speed
   condition:
      type: apoli:or
      conditions:
      - 
         type: apoli:resource
         resource: "*:*_force_state"
         comparison: '=='
         compare_to: 2
      -
         type: apoli:and
         conditions:
         - 
            type: apoli:resource
            resource: "*:*_force_state"
            comparison: '>='
            compare_to: 0
         -
            type: apoli:status_effect
            effect: minecraft:strength
   block_condition:
      type: apoli:and
      conditions:
      -
         type: apoli:hardness
         comparison: ">"
         compare_to: 0
      -
         type: apoli:adjacent
         adjacent_condition:
            type: apoli:and
            conditions:
            -
               type: apoli:fluid
               fluid_condition: { type: apoli:empty }
            -
               type: apoli:hardness
               comparison: ">="
               compare_to: 1.5
         comparison: '>='
         compare_to: 4
   modifier:
     operation: multiply_base_multiplicative
     value: -0.5
     name: sil_yoni:physique/powerless_arms
