plugins {
	id 'fabric-loom' version '1.12-SNAPSHOT'
	id "io.github.silvigarabis.yaml"
}

version = project.mod_version
group = project.maven_group
def modVersion = version
def depVersionApoli = project.apoli_version
def depVersionFabricApi = project.fabric_version
def depVersionFabricLoader = project.loader_version
def depVersionPehkui = project.pehkui_version
def depVersionOrigins = project.origins_version

base {
	archivesName = project.archives_base_name + "_private_content"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"sil_yoni_private_content" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand([
			"version": modVersion
		])

	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}
