buildscript {
	repositories {
		mavenCentral()
	}
	dependencies {
		classpath 'org.yaml:snakeyaml:1.27'
	}
}

plugins {
	id 'fabric-loom' version '1.12-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
def modVersion = version
def depVersionApoli = project.apoli_version
def depVersionFabricApi = project.fabric_version
def depVersionFabricLoader = project.loader_version

base {
	archivesName = project.archives_base_name
}

repositories {
	//apoli, pehkui
	maven { url 'https://jitpack.io' }
	//cardinal-components
	maven {
		name = 'Ladysnake Mods'
		url = 'https://maven.ladysnake.org/releases'
	}
	//cloth config
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/releases/" }
	//modmenu
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"sil_yoni" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	include "com.github.apace100:apoli:${project.apoli_version}"
	modImplementation "com.github.apace100:apoli:${project.apoli_version}"

	modImplementation("dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	modImplementation("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	modImplementation("com.github.Virtuoel:Pehkui:${pehkui_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
}

import groovy.json.JsonOutput
import org.yaml.snakeyaml.Yaml

processResources {
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand([
			"version": modVersion,
			"loader_version": depVersionFabricLoader,
            "fabric_version": depVersionFabricApi,
			"apoli_version": depVersionApoli,
		])

	}

    rename("\\.yml\$", ".json")

    filesMatching("**/*.yml") {
//        println "converting yml file %s to json".formatted(it.relativeSourcePath.toString())

        def yamlContent = new Yaml().load(it.open())
        def jsonContent = JsonOutput.toJson(yamlContent)

        def contentReplaced = false
        it.filter(line -> {
            if (contentReplaced) return
            contentReplaced = true
            return jsonContent
        })

	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

publishing {
    publications {
        register("mavenJava", MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            name = "localTest"
            url = uri(layout.buildDirectory.dir("repo"))
        }
    }
}